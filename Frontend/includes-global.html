<!-- API CLIENT V2 -->
<script src="/Task-Pro/Frontend/assets/js/api-client-v2.js"></script>

<!-- SESSION MANAGER -->
<script src="/Task-Pro/Frontend/assets/js/session-manager-enhanced.js"></script>

<!-- LOADERS -->
<script src="/Task-Pro/Frontend/assets/js/loaders.js"></script>
<link rel="stylesheet" href="/Task-Pro/Frontend/assets/css/loaders.css">

<!-- Initialisation universelle -->
<script>
    // Initialiser les icônes Lucide si disponible
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        
        // Vérifier l'authentification
        if (!sessionManager.isAuthenticated()) {
            const publicPages = ['login', 'inscription', 'index'];
            const currentPath = window.location.pathname;
            const isPublic = publicPages.some(page => currentPath.includes(page));
            
            if (!isPublic) {
                window.location.href = '/Task-Pro/Frontend/login.html';
            }
        }
    });

    // Fonction de déconnexion globale
    async function logout() {
        if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
            await sessionManager.logout();
        }
    }
</script>
