<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPro | Connexion</title>
    <link rel="stylesheet" href="loginstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-area">
                <div class="gold-circle-logo">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <h2>Task<span>Pro</span></h2>
            </div>

            <h3>Bienvenue</h3>
            <p>Connectez-vous pour accéder au dashboard</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Adresse Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="admin@taskpro.com" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <div class="label-wrapper">
                        <label for="password">Mot de passe</label>
                        <a href="#" class="forgot-link">Oublié ?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-login">Se connecter</button>
                
                <div class="footer-link">
                    Pas encore de compte ? <a href="#">S'inscrire</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Gestion de la redirection
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // 1. On empêche le rechargement de la page par défaut
            e.preventDefault(); 

            // 2. Petite animation visuelle (optionnel mais pro)
            const loginBox = document.querySelector('.login-box');
            loginBox.style.opacity = '0.5';
            loginBox.style.transform = 'scale(0.98)';
            
            // 3. Redirection directe vers le dashboard
            // IMPORTANT : Vérifie que ton fichier de dashboard s'appelle bien index.html
            // Si tu l'as nommé dashboard.html, remplace "index.html" par "dashboard.html" ci-dessous
            setTimeout(() => {
                window.location.href = "dashbord.html"; 
            }, 300); // Délai de 300ms pour laisser l'utilisateur voir le clic
        });
    </script>
</body>
</html>
