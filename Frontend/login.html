<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPro | Connexion</title>
    <link rel="stylesheet" href="loginstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-area">
                <div class="gold-circle-logo">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <h2>Task<span>Pro</span></h2>
            </div>

            <h3>Bienvenue</h3>
            <p>Connectez-vous pour accéder au dashboard</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Adresse Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="admin@taskpro.com" autocomplete="off" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <div class="label-wrapper">
                        <label for="password">Mot de passe</label>
                        <a href="#" class="forgot-link">Oublié ?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" autocomplete="new-password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-login">Se connecter</button>
                
                <div id="message" style="min-height: 20px; margin-top: 10px; text-align: center; font-weight: normal;">

                </div>    
                
                <div class="footer-link">
                    Pas encore de compte ? <a href="inscription.html">S'inscrire</a>
                </div>
            </form>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
