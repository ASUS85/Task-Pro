<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPRO - Connexion</title>
    <link rel="stylesheet" href="style_login.css">
    <link rel="stylesheet" href="assets/css/loaders.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@1.16.0/dist/umd/lucide.min.js"></script>
    <script src="assets/js/loaders.js"></script>
</head>
<body class="auth-page">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="auth-container glass-panel">
        
        <div class="auth-header">
            <div class="brand-logo">🟡</div>
            <h1>Bon retour !</h1>
            <p>Accédez à votre tableau de bord sécurisé</p>
        </div>

        <!-- ✅ AUTOCOMPLETE OFF -->
        <form id="loginForm" class="modern-form" autocomplete="off">
            
            <!-- ⚠️ INPUT FANTÔME (anti autofill) -->
            <input type="text" name="fake-user" style="display:none">
            <input type="password" name="fake-password" style="display:none">

            <div class="input-wrapper">
                <i data-lucide="mail"></i>
                <!-- ✅ AUTOCOMPLETE OFF -->
                <input type="email" id="email" placeholder="Adresse email" required autocomplete="off">
            </div>

            <div class="input-wrapper">
                <i data-lucide="lock"></i>
                <!-- ✅ NEW PASSWORD = bloque autofill -->
                <input type="password" id="password" placeholder="Mot de passe" required autocomplete="new-password">
            </div>

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox">
                    <span class="checkmark"></span>
                    Se souvenir de moi
                </label>
                <a href="#" class="magic-link small">Oublié ?</a>
            </div>

            <button type="submit" class="btn-primary-auth">
                <span>Se connecter</span>
                <i data-lucide="log-in"></i>
            </button>

        </form>

        <div id="loader" class="loader hidden">Initialisation...</div>

        <p id="message" style="min-height: 20px;"></p>

        <div class="auth-footer">
            <p>Pas encore de compte ? <a href="inscription.html" class="magic-link">Créer un compte</a></p>
        </div>

    </div>

    <script src="api.js"></script>
    <script src="script.js"></script>
    <script>
      lucide.createIcons();

      // ✅ RESET FORCÉ (anti remplissage après refresh)
      window.addEventListener("load", () => {
          document.getElementById("loginForm").reset();
      });
    </script>

</body>
</html>
